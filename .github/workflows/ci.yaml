name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_test
        ports:
          - 5432:5432
        # Wait for postgres to be ready before the job proceeds
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Points at the service container above, not localhost outside the job
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/app_test
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/app_test
      WEBHOOK_SECRET: ci-test-secret

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest httpx pytest-timeout python-dotenv

      - name: Run tests
        run: pytest --timeout=30 -v